<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UP Vision Inventory</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f4f7fb,
      #e9eef5
    );

  min-height: 100vh;

  color: #1f2937;
}


/* ==============================
   LOGIN
============================== */

.login-container {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;
}

.login-card {

  width: 100%;

  max-width: 420px;

  background: white;

  border-radius: 18px;

  padding: 35px;

  box-shadow:
    0 15px 45px rgba(0,0,0,0.12);
}

.logo {

  text-align: center;

  font-size: 30px;

  font-weight: 800;

  color: #1d4ed8;

  margin-bottom: 8px;
}

.subtitle {

  text-align: center;

  color: #6b7280;

  margin-bottom: 30px;
}


/* ==============================
   FORM
============================== */

label {

  display: block;

  font-weight: 600;

  margin-bottom: 8px;

  margin-top: 18px;
}

select,
input {

  width: 100%;

  padding: 15px;

  border-radius: 10px;

  border: 1px solid #d1d5db;

  font-size: 18px;

  outline: none;

  transition: 0.2s;
}

select:focus,
input:focus {

  border-color: #2563eb;

  box-shadow:
    0 0 0 3px rgba(37,99,235,0.12);
}


/* ==============================
   BUTTONS
============================== */

button {

  border: none;

  border-radius: 10px;

  padding: 15px 20px;

  font-size: 17px;

  font-weight: 700;

  cursor: pointer;

  transition: 0.2s;
}

button:hover {

  transform: translateY(-1px);
}

.login-button {

  width: 100%;

  background: #2563eb;

  color: white;

  margin-top: 25px;
}

.login-button:hover {

  background: #1d4ed8;
}


/* ==============================
   APP
============================== */

.app-container {

  display: none;

  min-height: 100vh;
}

.header {

  background: #111827;

  color: white;

  padding: 16px 25px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  flex-wrap: wrap;

  gap: 10px;
}

.header-title {

  font-size: 22px;

  font-weight: 800;
}

.user-info {

  display: flex;

  align-items: center;

  gap: 15px;
}

.logout {

  background: #ef4444;

  color: white;

  padding: 9px 15px;

  font-size: 14px;
}


/* ==============================
   MAIN
============================== */

.main {

  max-width: 900px;

  margin: auto;

  padding: 25px 18px 50px;
}

.scan-card {

  background: white;

  border-radius: 18px;

  padding: 25px;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

.step {

  display: inline-block;

  background: #dbeafe;

  color: #1d4ed8;

  padding: 6px 12px;

  border-radius: 30px;

  font-size: 13px;

  font-weight: 700;

  margin-bottom: 12px;
}

.scan-title {

  font-size: 28px;

  font-weight: 800;

  margin-bottom: 5px;
}

.scan-subtitle {

  color: #6b7280;

  margin-bottom: 25px;
}


/* ==============================
   DESCRIPTION
============================== */

.description {

  margin-top: 10px;

  padding: 14px;

  border-radius: 10px;

  background: #f3f4f6;

  min-height: 50px;

  font-size: 17px;
}

.description.found {

  background: #ecfdf5;

  color: #047857;

  border: 1px solid #a7f3d0;
}

.description.not-found {

  background: #fff7ed;

  color: #c2410c;

  border: 1px solid #fed7aa;
}


/* ==============================
   QTY
============================== */

.qty-section {

  margin-top: 25px;
}

.qty-input {

  font-size: 25px;

  text-align: center;

  font-weight: 700;
}


/* ==============================
   SPLIT BOXES
============================== */

.split-container {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 18px;

  margin-top: 25px;
}

.split-box {

  padding: 25px;

  border-radius: 16px;

  text-align: center;

  border: 3px solid transparent;
}

.green-box {

  background: #dcfce7;

  border-color: #22c55e;
}

.red-box {

  background: #fee2e2;

  border-color: #ef4444;
}

.box-title {

  font-size: 17px;

  font-weight: 800;

  margin-bottom: 10px;
}

.box-percent {

  font-size: 15px;

  opacity: 0.75;

  margin-bottom: 8px;
}

.box-qty {

  font-size: 42px;

  font-weight: 900;
}


/* ==============================
   IMAGE
============================== */

.image-section {

  margin-top: 30px;

  text-align: center;
}

.camera-button {

  width: 100%;

  background: #7c3aed;

  color: white;

  font-size: 18px;
}

.camera-button:hover {

  background: #6d28d9;
}

#imageInput {

  display: none;
}

.image-preview {

  margin-top: 15px;

  display: none;
}

.image-preview img {

  max-width: 100%;

  max-height: 300px;

  border-radius: 12px;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.15);
}


/* ==============================
   SUBMIT
============================== */

.submit-button {

  width: 100%;

  margin-top: 30px;

  background: #059669;

  color: white;

  font-size: 20px;
}

.submit-button:hover {

  background: #047857;
}

.submit-button:disabled {

  opacity: 0.6;

  cursor: not-allowed;

  transform: none;
}


/* ==============================
   STATUS
============================== */

.status {

  display: none;

  padding: 15px;

  border-radius: 10px;

  margin-top: 20px;

  text-align: center;

  font-weight: 600;
}

.status.success {

  display: block;

  background: #dcfce7;

  color: #166534;
}

.status.error {

  display: block;

  background: #fee2e2;

  color: #991b1b;
}

.status.loading {

  display: block;

  background: #dbeafe;

  color: #1e40af;
}


/* ==============================
   MOBILE
============================== */

@media(max-width: 650px) {

  .split-container {

    grid-template-columns: 1fr;

  }

  .scan-title {

    font-size: 24px;

  }

  .scan-card {

    padding: 18px;

  }

  .header {

    padding: 14px;

  }

}

</style>

</head>


<body>


<!-- =====================================
     LOGIN SCREEN
===================================== -->

<div
  id="loginScreen"
  class="login-container"
>

  <div class="login-card">

    <div class="logo">
      UP Vision
    </div>

    <div class="subtitle">
      Inventory Splitting Tool
    </div>


    <label for="userSelect">
      Select User
    </label>

    <select id="userSelect">

      <option value="">
        Select User
      </option>

      <option value="User 1">
        User 1
      </option>

      <option value="User 2">
        User 2
      </option>

      <option value="User 3">
        User 3
      </option>

      <option value="User 4">
        User 4
      </option>

      <option value="User 5">
        User 5
      </option>

    </select>


    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Enter password"
      autocomplete="off"
    >


    <button
      class="login-button"
      onclick="login()"
    >
      Login
    </button>


    <div
      id="loginError"
      class="status error"
    >
    </div>

  </div>

</div>



<!-- =====================================
     APPLICATION
===================================== -->

<div
  id="app"
  class="app-container"
>


  <!-- HEADER -->

  <header class="header">

    <div class="header-title">
      UP Vision Inventory
    </div>

    <div class="user-info">

      <span>
        Logged in as:
        <strong id="loggedUser"></strong>
      </span>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </header>



  <!-- MAIN -->

  <main class="main">

    <div class="scan-card">


      <div class="step">
        STEP 1
      </div>

      <div class="scan-title">
        Scan Product
      </div>

      <div class="scan-subtitle">
        Scan or manually enter the product barcode.
      </div>


      <!-- BARCODE -->

      <label for="barcode">
        Barcode
      </label>

      <input
        id="barcode"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Scan barcode..."
        onkeydown="barcodeKeyDown(event)"
      >


      <!-- DESCRIPTION -->

      <label>
        Product Description
      </label>

      <div
        id="description"
        class="description"
      >
        Waiting for barcode...
      </div>


      <!-- QUANTITY -->

      <div class="qty-section">

        <label for="quantity">
          Total Quantity
        </label>

        <input
          id="quantity"
          class="qty-input"
          type="number"
          min="0"
          step="1"
          placeholder="Enter quantity"
          oninput="calculateSplit()"
        >

      </div>


      <!-- SPLIT -->

      <div class="split-container">


        <div class="split-box green-box">

          <div class="box-title">
            GREEN BOX
          </div>

          <div class="box-percent">
            51%
          </div>

          <div
            id="greenQty"
            class="box-qty"
          >
            0
          </div>

        </div>


        <div class="split-box red-box">

          <div class="box-title">
            RED BOX
          </div>

          <div class="box-percent">
            49%
          </div>

          <div
            id="redQty"
            class="box-qty"
          >
            0
          </div>

        </div>


      </div>



      <!-- CAMERA -->

      <div class="image-section">

        <button
          class="camera-button"
          onclick="openCamera()"
        >
          📷 Add Product Image
        </button>


        <input
          id="imageInput"
          type="file"
          accept="image/*"
          capture="environment"
          onchange="imageSelected(event)"
        >


        <div
          id="imagePreview"
          class="image-preview"
        >

          <img
            id="previewImage"
            alt="Product preview"
          >

        </div>

      </div>



      <!-- STATUS -->

      <div
        id="status"
        class="status"
      >
      </div>



      <!-- SUBMIT -->

      <button
        id="submitButton"
        class="submit-button"
        onclick="submitProduct()"
      >
        ✓ Submit & Next Product
      </button>


    </div>

  </main>

</div>



<script>


/* =========================================
   CONFIGURATION
========================================= */


/*
 * IMPORTANT:
 *
 * Replace this URL with the Google Apps Script
 * Web App URL that you receive after deployment.
 */

const GOOGLE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbw23nMeoSZaMJExpOpTijf_6qzfpTifY5OQSlCo2qhJBhk1sqy5-gC56mT4O3m_BURG/exec";



/* =========================================
   LOGIN
========================================= */

const USERS = {

  "User 1": "U123",

  "User 2": "S456",

  "User 3": "E789",

  "User 4": "R147",

  "User 5": "258"

};


let currentUser = "";



function login() {

  const user =
    document
      .getElementById("userSelect")
      .value;

  const password =
    document
      .getElementById("password")
      .value;

  const error =
    document
      .getElementById("loginError");


  error.style.display = "none";


  if (!user) {

    showLoginError(
      "Please select a user."
    );

    return;
  }


  if (USERS[user] !== password) {

    showLoginError(
      "Incorrect password."
    );

    return;
  }


  currentUser = user;


  document
    .getElementById("loggedUser")
    .textContent = user;


  document
    .getElementById("loginScreen")
    .style.display = "none";


  document
    .getElementById("app")
    .style.display = "block";


  setTimeout(() => {

    document
      .getElementById("barcode")
      .focus();

  }, 200);

}



function showLoginError(message) {

  const error =
    document
      .getElementById("loginError");

  error.textContent = message;

  error.style.display = "block";

}



function logout() {

  currentUser = "";

  document
    .getElementById("app")
    .style.display = "none";

  document
    .getElementById("loginScreen")
    .style.display = "flex";

  document
    .getElementById("password")
    .value = "";

  document
    .getElementById("userSelect")
    .value = "";

}



/* =========================================
   BARCODE
========================================= */


function barcodeKeyDown(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    lookupDescription();

  }

}



let lookupTimer = null;



document
  .getElementById("barcode")
  .addEventListener(
    "input",
    function() {

      clearTimeout(lookupTimer);

      const barcode =
        this.value.trim();

      if (!barcode) {

        resetDescription();

        return;
      }


      /*
       * Small delay allows USB scanners
       * to finish typing the barcode.
       */

      lookupTimer =
        setTimeout(
          lookupDescription,
          300
        );

    }
  );



async function lookupDescription() {

  const barcode =
    document
      .getElementById("barcode")
      .value
      .trim();


  if (!barcode) {

    resetDescription();

    return;
  }


  const descriptionBox =
    document
      .getElementById("description");


  descriptionBox.className =
    "description";

  descriptionBox.textContent =
    "Looking up product...";


  try {

    const url =
      GOOGLE_SCRIPT_URL +
      "?action=description&barcode=" +
      encodeURIComponent(barcode);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (
      data.success &&
      data.description
    ) {

      descriptionBox.className =
        "description found";

      descriptionBox.textContent =
        data.description;

    } else {

      descriptionBox.className =
        "description not-found";

      descriptionBox.textContent =
        "Product description not found.";

    }

  } catch (error) {

    descriptionBox.className =
      "description not-found";

    descriptionBox.textContent =
      "Unable to connect to description database.";

    console.error(error);

  }

}



function resetDescription() {

  const box =
    document
      .getElementById("description");

  box.className =
    "description";

  box.textContent =
    "Waiting for barcode...";

}



/* =========================================
   QUANTITY SPLIT
========================================= */


function calculateSplit() {

  const quantity =
    Number(
      document
        .getElementById("quantity")
        .value
    );


  if (
    !quantity ||
    quantity <= 0
  ) {

    document
      .getElementById("greenQty")
      .textContent = "0";

    document
      .getElementById("redQty")
      .textContent = "0";

    return;
  }


  /*
   * 51% Green
   * 49% Red
   *
   * Math.floor is used for Green.
   * Red receives the remaining quantity.
   *
   * This guarantees:
   *
   * Green + Red = Total
   */

  const green =
    Math.floor(quantity * 0.51);

  const red =
    quantity - green;


  document
    .getElementById("greenQty")
    .textContent = green;


  document
    .getElementById("redQty")
    .textContent = red;

}



/* =========================================
   CAMERA
========================================= */


function openCamera() {

  document
    .getElementById("imageInput")
    .click();

}



let selectedImage = null;



function imageSelected(event) {

  const file =
    event.target.files[0];


  if (!file) {

    selectedImage = null;

    return;
  }


  selectedImage = file;


  const reader =
    new FileReader();


  reader.onload = function(e) {

    document
      .getElementById("previewImage")
      .src = e.target.result;


    document
      .getElementById("imagePreview")
      .style.display = "block";

  };


  reader.readAsDataURL(file);

}



/* =========================================
   IMAGE COMPRESSION
========================================= */


function compressImage(
  file,
  maxWidth = 1200,
  quality = 0.75
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload = function(event) {

        const img =
          new Image();


        img.onload = function() {

          let width =
            img.width;

          let height =
            img.height;


          if (width > maxWidth) {

            height =
              height *
              maxWidth /
              width;

            width =
              maxWidth;

          }


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          const compressed =
            canvas.toDataURL(
              "image/jpeg",
              quality
            );


          resolve(compressed);

        };


        img.onerror =
          reject;

        img.src =
          event.target.result;

      };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}



/* =========================================
   SUBMIT PRODUCT
========================================= */


async function submitProduct() {

  const barcode =
    document
      .getElementById("barcode")
      .value
      .trim();


  const quantity =
    Number(
      document
        .getElementById("quantity")
        .value
    );


  const description =
    document
      .getElementById("description")
      .textContent;


  const green =
    Number(
      document
        .getElementById("greenQty")
        .textContent
    );


  const red =
    Number(
      document
        .getElementById("redQty")
        .textContent
    );


  const submitButton =
    document
      .getElementById("submitButton");


  if (!barcode) {

    showStatus(
      "Please scan or enter a barcode.",
      "error"
    );

    focusBarcode();

    return;
  }


  if (
    !quantity ||
    quantity <= 0
  ) {

    showStatus(
      "Please enter a valid quantity.",
      "error"
    );

    document
      .getElementById("quantity")
      .focus();

    return;
  }


  if (
    description ===
    "Product description not found."
  ) {

    const proceed =
      confirm(
        "Product description was not found. Do you still want to submit?"
      );


    if (!proceed) {

      focusBarcode();

      return;
    }

  }


  submitButton.disabled = true;


  showStatus(
    "Saving inventory...",
    "loading"
  );


  try {

    let imageData = null;

    let imageName = "";


    /*
     * Compress image before uploading.
     */

    if (selectedImage) {

      imageData =
        await compressImage(
          selectedImage
        );

      imageName =
        createImageName(
          barcode
        );

    }


    const payload = {

      action: "submit",

      user: currentUser,

      barcode: barcode,

      description:
        description ===
        "Product description not found."
          ? ""
          : description,

      totalQty: quantity,

      greenQty: green,

      redQty: red,

      image:
        imageData
          ? true
          : false,

      imageData:
        imageData,

      imageName:
        imageName

    };


    const response =
      await fetch(
        GOOGLE_SCRIPT_URL,
        {

          method: "POST",

          body:
            JSON.stringify(payload),

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          }

        }
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "Unable to save data."
      );

    }


    showStatus(
      "✓ Saved successfully. Ready for next product.",
      "success"
    );


    /*
     * Clear the form.
     */

    resetProductForm();


    /*
     * Automatically put cursor back
     * in barcode field.
     */

    setTimeout(
      focusBarcode,
      150
    );


  } catch (error) {

    console.error(error);

    showStatus(
      "Unable to save. " +
      error.message,
      "error"
    );

  } finally {

    submitButton.disabled = false;

  }

}



/* =========================================
   RESET PRODUCT
========================================= */


function resetProductForm() {

  document
    .getElementById("barcode")
    .value = "";


  document
    .getElementById("quantity")
    .value = "";


  resetDescription();


  document
    .getElementById("greenQty")
    .textContent = "0";


  document
    .getElementById("redQty")
    .textContent = "0";


  selectedImage = null;


  document
    .getElementById("imageInput")
    .value = "";


  document
    .getElementById("imagePreview")
    .style.display = "none";


  document
    .getElementById("previewImage")
    .src = "";

}



function focusBarcode() {

  const barcode =
    document
      .getElementById("barcode");

  barcode.focus();

  barcode.select();

}



/* =========================================
   STATUS
========================================= */


function showStatus(
  message,
  type
) {

  const status =
    document
      .getElementById("status");


  status.textContent =
    message;


  status.className =
    "status " + type;


  if (type === "success") {

    setTimeout(
      () => {

        status.className =
          "status";

      },
      2500
    );

  }

}



/* =========================================
   IMAGE NAME
========================================= */


function createImageName(
  barcode
) {

  const date =
    new Date()
      .toISOString()
      .replace(
        /[:.]/g,
        "-"
      );


  return (
    "UPVision_" +
    barcode +
    "_" +
    date +
    ".jpg"
  );

}



/* =========================================
   ENTER KEY SUPPORT
========================================= */


document
  .getElementById("quantity")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        submitProduct();

      }

    }
  );


/*
 * Automatically focus barcode
 * if user clicks anywhere in the
 * application and no input is active.
 */

document.addEventListener(
  "click",
  function(event) {

    if (
      document
        .getElementById("app")
        .style.display !== "block"
    ) {
      return;
    }


    const tag =
      event.target.tagName;


    if (
      tag !== "INPUT" &&
      tag !== "BUTTON" &&
      tag !== "SELECT"
    ) {

      focusBarcode();

    }

  }
);

</script>

</body>

</html>
