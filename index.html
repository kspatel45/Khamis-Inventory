<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UP Vision Inventory</title>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef3f8,
      #f8fafc
    );

  color: #172033;

  min-height: 100vh;

}


/* =====================================================
   LOGIN
===================================================== */

.login-container {

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;

}


.login-card {

  width: 100%;

  max-width: 430px;

  background: white;

  padding: 38px;

  border-radius: 22px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,0.12);

}


.logo {

  text-align: center;

  font-size: 34px;

  font-weight: 900;

  color: #155eef;

}


.subtitle {

  text-align: center;

  color: #6b7280;

  margin-top: 8px;

  margin-bottom: 30px;

}


label {

  display: block;

  font-size: 17px;

  font-weight: 700;

  margin-top: 18px;

  margin-bottom: 8px;

}


input,
select {

  width: 100%;

  height: 58px;

  padding: 0 16px;

  border: 1px solid #cbd5e1;

  border-radius: 12px;

  font-size: 19px;

  outline: none;

}


input:focus,
select:focus {

  border-color: #2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,0.12);

}


.login-button {

  width: 100%;

  margin-top: 28px;

  height: 58px;

  border: none;

  border-radius: 12px;

  background: #2563eb;

  color: white;

  font-size: 19px;

  font-weight: 800;

  cursor: pointer;

}


/* =====================================================
   APPLICATION
===================================================== */

.app {

  display: none;

  min-height: 100vh;

}


.header {

  background: #111827;

  color: white;

  padding: 15px 25px;

  display: flex;

  justify-content: space-between;

  align-items: center;

}


.header-title {

  font-size: 23px;

  font-weight: 900;

}


.header-user {

  display: flex;

  gap: 15px;

  align-items: center;

}


.logout-button {

  border: none;

  background: #ef4444;

  color: white;

  padding: 10px 15px;

  border-radius: 9px;

  font-weight: 700;

  cursor: pointer;

}


/* =====================================================
   MAIN
===================================================== */

.main {

  width: 100%;

  max-width: 950px;

  margin: auto;

  padding: 25px 18px 60px;

}


.card {

  background: white;

  border-radius: 20px;

  padding: 28px;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,0.08);

}


.step {

  display: inline-block;

  padding: 7px 14px;

  border-radius: 20px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 13px;

  font-weight: 800;

}


.title {

  font-size: 30px;

  font-weight: 900;

  margin-top: 12px;

}


.subtitle2 {

  color: #64748b;

  margin-top: 5px;

  margin-bottom: 25px;

}


/* =====================================================
   BARCODE
===================================================== */

.barcode-input {

  height: 65px !important;

  font-size: 25px !important;

  font-weight: 700;

}


/* =====================================================
   DESCRIPTION
===================================================== */

.description {

  min-height: 58px;

  padding: 16px;

  border-radius: 12px;

  background: #f1f5f9;

  border: 1px solid #e2e8f0;

  font-size: 18px;

  display: flex;

  align-items: center;

}


.description.found {

  background: #ecfdf5;

  border-color: #86efac;

  color: #047857;

  font-weight: 700;

}


.description.not-found {

  background: #fff7ed;

  border-color: #fdba74;

  color: #c2410c;

}


/* =====================================================
   QUANTITY
===================================================== */

.quantity {

  text-align: center;

  font-size: 28px !important;

  font-weight: 900;

}


/* =====================================================
   SPLIT
===================================================== */

.split {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 20px;

  margin-top: 25px;

}


.split-box {

  text-align: center;

  border-radius: 18px;

  padding: 25px;

  border: 3px solid;

}


.green {

  background: #dcfce7;

  border-color: #22c55e;

}


.red {

  background: #fee2e2;

  border-color: #ef4444;

}


.box-name {

  font-size: 20px;

  font-weight: 900;

}


.percent {

  margin-top: 7px;

  color: #64748b;

  font-size: 17px;

}


.box-number {

  font-size: 48px;

  font-weight: 900;

  margin-top: 8px;

}


/* =====================================================
   CAMERA
===================================================== */

.camera-button {

  width: 100%;

  height: 60px;

  margin-top: 28px;

  border: none;

  border-radius: 12px;

  background: #7c3aed;

  color: white;

  font-size: 19px;

  font-weight: 900;

  cursor: pointer;

}


.camera-button:hover {

  background: #6d28d9;

}


.preview-container {

  display: none;

  margin-top: 18px;

  text-align: center;

}


.preview-container img {

  max-width: 100%;

  max-height: 350px;

  border-radius: 15px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,0.15);

}


/* =====================================================
   SUBMIT
===================================================== */

.submit-button {

  width: 100%;

  height: 62px;

  margin-top: 28px;

  border: none;

  border-radius: 12px;

  background: #059669;

  color: white;

  font-size: 20px;

  font-weight: 900;

  cursor: pointer;

}


.submit-button:disabled {

  opacity: 0.6;

  cursor: not-allowed;

}


/* =====================================================
   STATUS
===================================================== */

.status {

  display: none;

  padding: 15px;

  border-radius: 12px;

  margin-top: 20px;

  text-align: center;

  font-weight: 700;

}


.status.success {

  display: block;

  background: #dcfce7;

  color: #166534;

}


.status.error {

  display: block;

  background: #fee2e2;

  color: #991b1b;

}


.status.loading {

  display: block;

  background: #dbeafe;

  color: #1e40af;

}


/* =====================================================
   CAMERA MODAL
===================================================== */

.camera-modal {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 9999;

  background:
    rgba(0,0,0,0.92);

  justify-content: center;

  align-items: center;

  padding: 20px;

}


.camera-window {

  width: 100%;

  max-width: 700px;

  background: #111827;

  border-radius: 20px;

  padding: 15px;

}


.camera-video {

  width: 100%;

  display: block;

  background: black;

  border-radius: 14px;

  max-height: 70vh;

}


.camera-controls {

  display: flex;

  gap: 10px;

  margin-top: 15px;

}


.take-picture {

  flex: 1;

  height: 55px;

  border: none;

  border-radius: 10px;

  background: #16a34a;

  color: white;

  font-size: 18px;

  font-weight: 900;

}


.close-camera {

  flex: 1;

  height: 55px;

  border: none;

  border-radius: 10px;

  background: #dc2626;

  color: white;

  font-size: 18px;

  font-weight: 900;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:650px) {

  .header {

    padding: 14px;

  }


  .header-title {

    font-size: 18px;

  }


  .header-user {

    font-size: 13px;

  }


  .card {

    padding: 18px;

  }


  .title {

    font-size: 25px;

  }


  .split {

    grid-template-columns: 1fr;

  }


  .box-number {

    font-size: 42px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div
  id="loginScreen"
  class="login-container"
>

  <div class="login-card">

    <div class="logo">
      UP Vision
    </div>

    <div class="subtitle">
      Inventory Splitting Tool
    </div>


    <label>
      User
    </label>

    <select id="userSelect">

      <option value="">
        Select User
      </option>

      <option value="User 1">
        User 1
      </option>

      <option value="User 2">
        User 2
      </option>

      <option value="User 3">
        User 3
      </option>

      <option value="User 4">
        User 4
      </option>

      <option value="User 5">
        User 5
      </option>

    </select>


    <label>
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Enter password"
    >


    <button
      class="login-button"
      onclick="login()"
    >
      Login
    </button>


    <div
      id="loginError"
      class="status error"
    ></div>

  </div>

</div>



<!-- =====================================================
     APP
===================================================== -->

<div
  id="app"
  class="app"
>


<header class="header">

  <div class="header-title">
    UP Vision Inventory
  </div>


  <div class="header-user">

    <span>
      <span id="loggedUser"></span>
    </span>

    <button
      class="logout-button"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</header>



<main class="main">

<div class="card">


  <div class="step">
    STEP 1
  </div>


  <div class="title">
    Scan Product
  </div>


  <div class="subtitle2">
    Scan the barcode, enter quantity,
    take a picture and submit.
  </div>



  <!-- BARCODE -->

  <label>
    Barcode
  </label>

  <input
    id="barcode"
    class="barcode-input"
    type="text"
    placeholder="Scan barcode..."
    autocomplete="off"
  >



  <!-- DESCRIPTION -->

  <label>
    Product Description
  </label>

  <div
    id="description"
    class="description"
  >
    Waiting for barcode...
  </div>



  <!-- QUANTITY -->

  <label>
    Total Quantity
  </label>

  <input
    id="quantity"
    class="quantity"
    type="number"
    min="1"
    step="1"
    placeholder="Enter quantity"
  >



  <!-- SPLIT -->

  <div class="split">


    <div
      class="split-box green"
    >

      <div class="box-name">
        GREEN BOX
      </div>

      <div class="percent">
        51%
      </div>

      <div
        id="greenQty"
        class="box-number"
      >
        0
      </div>

    </div>


    <div
      class="split-box red"
    >

      <div class="box-name">
        RED BOX
      </div>

      <div class="percent">
        49%
      </div>

      <div
        id="redQty"
        class="box-number"
      >
        0
      </div>

    </div>


  </div>



  <!-- CAMERA -->

  <button
    class="camera-button"
    onclick="openCamera()"
  >
    📷 Open Camera
  </button>


  <div
    id="previewContainer"
    class="preview-container"
  >

    <img
      id="previewImage"
      alt="Product photo"
    >

  </div>



  <!-- STATUS -->

  <div
    id="status"
    class="status"
  ></div>



  <!-- SUBMIT -->

  <button
    id="submitButton"
    class="submit-button"
    onclick="submitProduct()"
  >
    ✓ Submit & Next Product
  </button>


</div>

</main>

</div>



<!-- =====================================================
     CAMERA MODAL
===================================================== -->

<div
  id="cameraModal"
  class="camera-modal"
>

  <div class="camera-window">


    <video
      id="cameraVideo"
      class="camera-video"
      autoplay
      playsinline
    ></video>


    <canvas
      id="cameraCanvas"
      style="display:none;"
    ></canvas>


    <div class="camera-controls">

      <button
        class="take-picture"
        onclick="takePicture()"
      >
        📸 Take Picture
      </button>


      <button
        class="close-camera"
        onclick="closeCamera()"
      >
        ✕ Close
      </button>

    </div>

  </div>

</div>



<!-- =====================================================
     HIDDEN SAVE FORM
===================================================== -->

<iframe
  name="saveFrame"
  id="saveFrame"
  style="display:none;"
></iframe>


<form
  id="saveForm"
  method="POST"
  target="saveFrame"
  style="display:none;"
>

  <input
    name="action"
    value="submit"
  >

  <input
    id="formUser"
    name="user"
  >

  <input
    id="formBarcode"
    name="barcode"
  >

  <input
    id="formDescription"
    name="description"
  >

  <input
    id="formTotalQty"
    name="totalQty"
  >

  <input
    id="formGreenQty"
    name="greenQty"
  >

  <input
    id="formRedQty"
    name="redQty"
  >

  <input
    id="formImageData"
    name="imageData"
  >

  <input
    id="formImageName"
    name="imageName"
  >

</form>



<script>


/* =========================================================
   GOOGLE APPS SCRIPT URL
========================================================= */

const GOOGLE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby_hmyJjGZn733R3FX5sumTdHYyRpuNSuu_Bu6VTVtoZdoYjkpbHf3qVFlQLmUUuLUi/exec";


/* =========================================================
   USERS
========================================================= */

const USERS = {

  "User 1": "U123",

  "User 2": "S456",

  "User 3": "E789",

  "User 4": "R147",

  "User 5": "258"

};


let currentUser = "";

let lookupTimer = null;

let jsonpCounter = 0;

let cameraStream = null;

let capturedImage = null;


/* =========================================================
   LOGIN
========================================================= */

function login() {

  const user =
    document
      .getElementById("userSelect")
      .value;


  const password =
    document
      .getElementById("password")
      .value;


  const error =
    document
      .getElementById("loginError");


  error.style.display =
    "none";


  if (!user) {

    error.textContent =
      "Please select a user.";

    error.style.display =
      "block";

    return;

  }


  if (
    USERS[user] !== password
  ) {

    error.textContent =
      "Incorrect password.";

    error.style.display =
      "block";

    return;

  }


  currentUser =
    user;


  document
    .getElementById("loggedUser")
    .textContent =
    user;


  document
    .getElementById("loginScreen")
    .style.display =
    "none";


  document
    .getElementById("app")
    .style.display =
    "block";


  setTimeout(
    focusBarcode,
    200
  );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

  closeCamera();

  currentUser = "";

  document
    .getElementById("app")
    .style.display =
    "none";


  document
    .getElementById("loginScreen")
    .style.display =
    "flex";


  document
    .getElementById("password")
    .value =
    "";


  document
    .getElementById("userSelect")
    .value =
    "";


  resetProduct();

}


/* =========================================================
   BARCODE
========================================================= */

document
  .getElementById("barcode")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        lookupDescription();

      }

    }
  );


document
  .getElementById("barcode")
  .addEventListener(
    "input",
    function() {

      clearTimeout(
        lookupTimer
      );


      const value =
        this.value.trim();


      if (!value) {

        resetDescription();

        return;

      }


      lookupTimer =
        setTimeout(
          lookupDescription,
          350
        );

    }
  );


/* =========================================================
   DESCRIPTION LOOKUP
========================================================= */

function lookupDescription() {

  const barcode =
    document
      .getElementById("barcode")
      .value
      .trim();


  if (!barcode) {

    resetDescription();

    return;

  }


  const box =
    document
      .getElementById("description");


  box.className =
    "description";


  box.textContent =
    "Looking up product...";


  jsonpCounter++;


  const callbackName =
    "descriptionCallback_" +
    jsonpCounter;


  const script =
    document.createElement(
      "script"
    );


  let finished =
    false;


  window[callbackName] =
    function(data) {

      finished =
        true;


      if (
        data &&
        data.success &&
        data.description
      ) {

        box.className =
          "description found";


        box.textContent =
          data.description;

      } else {

        box.className =
          "description not-found";


        box.textContent =
          "Product description not found.";

      }


      cleanup();

    };


  function cleanup() {

    delete window[
      callbackName
    ];


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      box.className =
        "description not-found";


      box.textContent =
        "Unable to connect to Google Sheets.";


      cleanup();

    };


  script.src =
    GOOGLE_SCRIPT_URL +
    "?action=description" +
    "&barcode=" +
    encodeURIComponent(
      barcode
    ) +
    "&callback=" +
    callbackName;


  document
    .body
    .appendChild(script);

}


function resetDescription() {

  const box =
    document
      .getElementById("description");


  box.className =
    "description";


  box.textContent =
    "Waiting for barcode...";

}


/* =========================================================
   QUANTITY SPLIT
========================================================= */

document
  .getElementById("quantity")
  .addEventListener(
    "input",
    calculateSplit
  );


function calculateSplit() {

  const input =
    document
      .getElementById("quantity");


  let quantity =
    Number(input.value);


  if (
    !Number.isFinite(quantity) ||
    quantity <= 0
  ) {

    document
      .getElementById("greenQty")
      .textContent =
      "0";


    document
      .getElementById("redQty")
      .textContent =
      "0";


    return;

  }


  /*
   * Inventory must be whole pieces.
   *
   * Rule:
   *
   * The 51% bucket receives the piece
   * whenever there is an odd split.
   *
   * Examples:
   *
   * 1  = 1 / 0
   * 2  = 1 / 1
   * 3  = 2 / 1
   * 4  = 2 / 2
   * 5  = 3 / 2
   * 6  = 3 / 3
   * 7  = 4 / 3
   * 101 = 52 / 49
   *
   * Math.round(51%) is used because the
   * 51% side is the preferred bucket.
   */

  quantity =
    Math.floor(quantity);


  const green =
    Math.round(
      quantity * 0.51
    );


  const red =
    quantity - green;


  document
    .getElementById("greenQty")
    .textContent =
    green;


  document
    .getElementById("redQty")
    .textContent =
    red;

}


/* =========================================================
   CAMERA
========================================================= */

async function openCamera() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      "Camera is not supported by this browser.",
      "error"
    );

    return;

  }


  try {

    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            }

          },

          audio: false

        });


    const video =
      document
        .getElementById("cameraVideo");


    video.srcObject =
      cameraStream;


    document
      .getElementById("cameraModal")
      .style.display =
      "flex";


  } catch (error) {

    console.error(error);


    showStatus(
      "Camera permission was denied or the camera could not be opened.",
      "error"
    );

  }

}


/* =========================================================
   TAKE PICTURE
========================================================= */

function takePicture() {

  const video =
    document
      .getElementById("cameraVideo");


  const canvas =
    document
      .getElementById("cameraCanvas");


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    showStatus(
      "Camera is not ready yet.",
      "error"
    );

    return;

  }


  let width =
    video.videoWidth;


  let height =
    video.videoHeight;


  const maxWidth =
    1200;


  if (
    width > maxWidth
  ) {

    height =
      height *
      maxWidth /
      width;

    width =
      maxWidth;

  }


  canvas.width =
    width;


  canvas.height =
    height;


  const context =
    canvas.getContext(
      "2d"
    );


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  capturedImage =
    canvas.toDataURL(
      "image/jpeg",
      0.75
    );


  document
    .getElementById("previewImage")
    .src =
    capturedImage;


  document
    .getElementById("previewContainer")
    .style.display =
    "block";


  closeCamera();


  showStatus(
    "Photo captured successfully.",
    "success"
  );

}


/* =========================================================
   CLOSE CAMERA
========================================================= */

function closeCamera() {

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    cameraStream =
      null;

  }


  const video =
    document
      .getElementById("cameraVideo");


  if (video) {

    video.srcObject =
      null;

  }


  document
    .getElementById("cameraModal")
    .style.display =
    "none";

}


/* =========================================================
   SUBMIT
========================================================= */

function submitProduct() {

  const barcode =
    document
      .getElementById("barcode")
      .value
      .trim();


  const quantity =
    Math.floor(
      Number(
        document
          .getElementById("quantity")
          .value
      )
    );


  const descriptionElement =
    document
      .getElementById("description");


  const description =
    descriptionElement
      .textContent
      .trim();


  const green =
    Number(
      document
        .getElementById("greenQty")
        .textContent
    );


  const red =
    Number(
      document
        .getElementById("redQty")
        .textContent
    );


  /* -----------------------------------------
     VALIDATION
  ----------------------------------------- */

  if (!barcode) {

    showStatus(
      "Please scan a barcode.",
      "error"
    );

    focusBarcode();

    return;

  }


  if (
    !quantity ||
    quantity <= 0
  ) {

    showStatus(
      "Please enter a valid quantity.",
      "error"
    );

    document
      .getElementById("quantity")
      .focus();

    return;

  }


  if (
    green + red !== quantity
  ) {

    showStatus(
      "Box quantities do not match total quantity.",
      "error"
    );

    return;

  }


  if (
    description ===
    "Looking up product..."
  ) {

    showStatus(
      "Please wait for the product description.",
      "error"
    );

    return;

  }


  /* -----------------------------------------
     REQUEST ID
  ----------------------------------------- */

  const requestId =
    createRequestId();


  /* -----------------------------------------
     BUTTON
  ----------------------------------------- */

  const button =
    document
      .getElementById("submitButton");


  button.disabled =
    true;


  button.textContent =
    "Saving...";


  showStatus(
    "Saving inventory to Google Sheets...",
    "loading"
  );


  /* -----------------------------------------
     FORM VALUES
  ----------------------------------------- */

  document
    .getElementById("formUser")
    .value =
    currentUser;


  document
    .getElementById("formBarcode")
    .value =
    barcode;


  document
    .getElementById("formDescription")
    .value =
    (
      description ===
      "Product description not found."
        ? ""
        : description
    );


  document
    .getElementById("formTotalQty")
    .value =
    quantity;


  document
    .getElementById("formGreenQty")
    .value =
    green;


  document
    .getElementById("formRedQty")
    .value =
    red;


  document
    .getElementById("formImageData")
    .value =
    capturedImage || "";


  document
    .getElementById("formImageName")
    .value =
    createImageName(
      barcode
    );


  /*
   * NEW:
   * Unique ID used to confirm the
   * Google Sheet write.
   */

  document
    .getElementById("formRequestId")
    .value =
    requestId;


  /* -----------------------------------------
     SUBMIT FORM
  ----------------------------------------- */

  document
    .getElementById("saveForm")
    .action =
    GOOGLE_SCRIPT_URL;


  document
    .getElementById("saveForm")
    .submit();


  /*
   * Now wait for actual confirmation.
   */

  pollSaveStatus(
    requestId,
    0
  );

}


/* =========================================================
   SAVE STATUS POLLING
========================================================= */

function pollSaveStatus(
  requestId,
  attempt
) {

  /*
   * Maximum:
   *
   * 30 attempts
   * x 1 second
   * = 30 seconds
   */

  if (
    attempt >= 30
  ) {

    const button =
      document
        .getElementById("submitButton");


    button.disabled =
      false;


    button.textContent =
      "✓ Submit & Next Product";


    showStatus(
      "Save could not be confirmed after 30 seconds. Please check Sheet 1 before submitting again.",
      "error"
    );


    return;

  }


  const callbackName =
    "statusCallback_" +
    Date.now() +
    "_" +
    attempt;


  const script =
    document.createElement(
      "script"
    );


  let finished =
    false;


  window[callbackName] =
    function(data) {

      finished =
        true;


      cleanup();


      if (
        data &&
        data.completed
      ) {

        if (
          data.success
        ) {

          saveSucceeded();

        } else {

          saveFailed(
            data.error ||
            "Google Apps Script could not save the record."
          );

        }

        return;

      }


      /*
       * Not finished yet.
       */

      setTimeout(
        function() {

          pollSaveStatus(
            requestId,
            attempt + 1
          );

        },
        1000
      );

    };


  function cleanup() {

    delete window[
      callbackName
    ];


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      cleanup();


      setTimeout(
        function() {

          pollSaveStatus(
            requestId,
            attempt + 1
          );

        },
        1000
      );

    };


  script.src =
    GOOGLE_SCRIPT_URL +
    "?action=status" +
    "&requestId=" +
    encodeURIComponent(
      requestId
    ) +
    "&callback=" +
    callbackName;


  document
    .body
    .appendChild(script);

}


/* =========================================================
   SAVE SUCCESS
========================================================= */

function saveSucceeded() {

  showStatus(
    "✓ Saved successfully to Sheet 1.",
    "success"
  );


  const button =
    document
      .getElementById("submitButton");


  button.disabled =
    false;


  button.textContent =
    "✓ Submit & Next Product";


  /*
   * Only NOW do we clear the form.
   */

  resetProduct();


  /*
   * Immediately prepare for next scan.
   */

  setTimeout(
    focusBarcode,
    150
  );

}


/* =========================================================
   SAVE FAILED
========================================================= */

function saveFailed(
  message
) {

  const button =
    document
      .getElementById("submitButton");


  button.disabled =
    false;


  button.textContent =
    "✓ Submit & Next Product";


  showStatus(
    "Unable to save: " +
    message,
    "error"
  );

}


/* =========================================================
   REQUEST ID
========================================================= */

function createRequestId() {

  return (
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 12)
  );

}


/* =========================================================
   RESET PRODUCT
========================================================= */

function resetProduct() {

  document
    .getElementById("barcode")
    .value =
    "";


  document
    .getElementById("quantity")
    .value =
    "";


  resetDescription();


  document
    .getElementById("greenQty")
    .textContent =
    "0";


  document
    .getElementById("redQty")
    .textContent =
    "0";


  capturedImage =
    null;


  document
    .getElementById("previewImage")
    .src =
    "";


  document
    .getElementById("previewContainer")
    .style.display =
    "none";

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type
) {

  const status =
    document
      .getElementById("status");


  status.textContent =
    message;


  status.className =
    "status " + type;

}


/* =========================================================
   FOCUS BARCODE
========================================================= */

function focusBarcode() {

  const barcode =
    document
      .getElementById("barcode");


  barcode.focus();

  barcode.select();

}


/* =========================================================
   IMAGE NAME
========================================================= */

function createImageName(
  barcode
) {

  const date =
    new Date()
      .toISOString()
      .replace(
        /[:.]/g,
        "-"
      );


  return (
    "UPVision_" +
    barcode +
    "_" +
    date +
    ".jpg"
  );

}


/* =========================================================
   ENTER ON QUANTITY
========================================================= */

document
  .getElementById("quantity")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        submitProduct();

      }

    }
  );
</script>
