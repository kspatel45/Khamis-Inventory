<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  UP Vision Inventory
</title>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    #eef2f7;

  color:
    #172033;

}


button,
input,
select {

  font-family:
    inherit;

}


.requiredStar {
  color: #ef4444;
  margin-left: 4px;
}


/* =========================================================
   LOGIN
========================================================= */

#loginScreen {

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;

}


.loginCard {

  width: 100%;

  max-width: 450px;

  background: white;

  border-radius: 22px;

  padding: 35px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.12);

}


.logo {

  text-align: center;

  font-size: 32px;

  font-weight: 800;

  margin-bottom: 5px;

}


.subtitle {

  text-align: center;

  color: #64748b;

  margin-bottom: 30px;

}


.loginLabel {

  display: block;

  font-weight: 700;

  margin:
    0 0 8px;

}


.loginInput {

  width: 100%;

  height: 55px;

  border:
    1px solid #cbd5e1;

  border-radius: 12px;

  padding:
    0 16px;

  font-size: 18px;

  margin-bottom: 18px;

  outline: none;

}


.loginInput:focus {

  border-color:
    #6d35e8;

  box-shadow:
    0 0 0 3px
    rgba(109,53,232,.12);

}


.loginButton {

  width: 100%;

  height: 55px;

  border: none;

  border-radius: 12px;

  background:
    #6d35e8;

  color: white;

  font-size: 18px;

  font-weight: 800;

  cursor: pointer;

}


.loginButton:hover {

  background:
    #5b28d1;

}


.loginError {

  display: none;

  background:
    #fee2e2;

  color:
    #b91c1c;

  border-radius: 10px;

  padding: 12px;

  margin-bottom: 18px;

  text-align: center;

  font-weight: 700;

}


/* =========================================================
   MAIN APPLICATION
========================================================= */

#app {

  display: none;

  min-height: 100vh;

}


.header {

  background:
    #172033;

  color: white;

  padding:
    16px 20px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

}


.headerTitle {

  font-size: 23px;

  font-weight: 800;

}


.headerUser {

  display: flex;

  align-items: center;

  gap: 12px;

}


.logoutButton {

  background:
    #334155;

  color: white;

  border: none;

  padding:
    9px 14px;

  border-radius: 9px;

  cursor: pointer;

  font-weight: 700;

}


.logoutButton:hover {

  background:
    #475569;

}


.container {

  width: 100%;

  max-width: 1000px;

  margin:
    0 auto;

  padding:
    20px;

}


/* =========================================================
   CARD
========================================================= */

.card {

  background: white;

  border-radius: 20px;

  padding: 22px;

  margin-bottom: 20px;

  box-shadow:
    0 7px 25px
    rgba(0,0,0,.07);

}


.fieldLabel {

  display: block;

  font-size: 18px;

  font-weight: 800;

  margin-bottom: 8px;

}


.mainInput {

  width: 100%;

  height: 62px;

  border:
    1px solid #cbd5e1;

  border-radius: 13px;

  padding:
    0 18px;

  font-size: 22px;

  outline: none;

}


.mainInput:focus {

  border-color:
    #6d35e8;

  box-shadow:
    0 0 0 3px
    rgba(109,53,232,.12);

}


/* =========================================================
   DESCRIPTION
========================================================= */

.description {

  min-height: 58px;

  display: flex;

  align-items: center;

  border:
    1px solid #cbd5e1;

  background:
    #f8fafc;

  border-radius: 13px;

  padding:
    12px 16px;

  font-size: 19px;

  color:
    #475569;

}


.description.found {

  background:
    #ecfdf5;

  border-color:
    #86efac;

  color:
    #166534;

  font-weight: 700;

}


.description.not-found {

  background:
    #fff7ed;

  border-color:
    #fdba74;

  color:
    #c2410c;

}


/* =========================================================
   QUANTITY
========================================================= */

.quantityInput {

  text-align: center;

  font-size: 28px;

  font-weight: 800;

}


  
/* =========================================================
   BOXES
========================================================= */

.splitContainer {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 18px;

  margin-top: 18px;

}


.splitBox {

  min-height: 190px;

  border-radius: 18px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

}


.greenBox {

  background:
    #dcfce7;

  border:
    3px solid #22c55e;

}


.redBox {

  background:
    #fee2e2;

  border:
    3px solid #ef4444;

}


.boxTitle {

  font-size: 20px;

  font-weight: 900;

}


.boxPercent {

  font-size: 18px;

  color:
    #64748b;

  margin-top: 8px;

}


.boxNumber {

  font-size: 52px;

  font-weight: 900;

  margin-top: 8px;

}


/* =========================================================
   CAMERA BUTTON
========================================================= */

.cameraButton {

  width: 100%;

  height: 62px;

  border: none;

  border-radius: 13px;

  background:
    #6d35e8;

  color: white;

  font-size: 19px;

  font-weight: 800;

  cursor: pointer;

  margin-top: 20px;

}


.cameraButton:hover {

  background:
    #5b28d1;

}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

#previewContainer {

  display: none;

  text-align: center;

  margin-top: 18px;

}


#previewImage {

  max-width: 100%;

  max-height: 350px;

  border-radius: 14px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.15);

}


/* =========================================================
   STATUS
========================================================= */

.status {

  display: none;

  padding:
    16px;

  border-radius: 13px;

  text-align: center;

  font-weight: 800;

  font-size: 17px;

  margin-top: 18px;

}


.status.loading {

  display: block;

  background:
    #dbeafe;

  color:
    #1d4ed8;

}


.status.success {

  display: block;

  background:
    #dcfce7;

  color:
    #166534;

}


.status.error {

  display: block;

  background:
    #fee2e2;

  color:
    #b91c1c;

}


/* =========================================================
   SUBMIT
========================================================= */

.submitButton {

  width: 100%;

  height: 66px;

  border: none;

  border-radius: 14px;

  background:
    #059669;

  color: white;

  font-size: 20px;

  font-weight: 900;

  cursor: pointer;

  margin-top: 18px;

}


.submitButton:hover {

  background:
    #047857;

}


.submitButton:disabled {

  opacity: .65;

  cursor:
    not-allowed;

}


/* =========================================================
   CAMERA MODAL
========================================================= */

#cameraModal {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 9999;

  background:
    rgba(0,0,0,.92);

  align-items: center;

  justify-content: center;

  padding: 15px;

}


.cameraWindow {

  width: 100%;

  max-width: 700px;

  background:
    #111827;

  border-radius: 18px;

  padding: 15px;

}


#cameraVideo {

  width: 100%;

  max-height: 65vh;

  object-fit: contain;

  border-radius: 12px;

  background:
    black;

}


.cameraControls {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;

  margin-top: 14px;

}


.takePhotoButton,
.closeCameraButton {

  height: 55px;

  border: none;

  border-radius: 12px;

  font-size: 17px;

  font-weight: 800;

  cursor: pointer;

}


.takePhotoButton {

  background:
    #22c55e;

  color: white;

}


.closeCameraButton {

  background:
    #475569;

  color: white;

}


/* =========================================================
   DESKTOP
========================================================= */

@media (
  min-width: 700px
) {

  .card {

    padding:
      28px;

  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (
  max-width: 600px
) {

  .header {

    align-items:
      flex-start;

  }


  .headerTitle {

    font-size: 19px;

  }


  .headerUser {

    flex-direction:
      column;

    align-items:
      flex-end;

    gap: 5px;

  }


  .container {

    padding:
      12px;

  }


  .card {

    padding:
      17px;

    border-radius:
      16px;

  }


  .splitContainer {

    gap: 10px;

  }


  .splitBox {

    min-height:
      160px;

  }


  .boxNumber {

    font-size:
      43px;

  }


  .boxTitle {

    font-size:
      17px;

  }

}

</style>

</head>


<body>


<!-- =======================================================
     LOGIN SCREEN
======================================================== -->

<div id="loginScreen">

  <div class="loginCard">

    <div class="logo">
      UP Vision
    </div>

    <div class="subtitle">
      Inventory Splitting Tool
    </div>


    <div
      id="loginError"
      class="loginError"
    ></div>


    <label
      class="loginLabel"
      for="userSelect"
    >
      User<span class="requiredStar">*</span>
    </label>


    <select
      id="userSelect"
      class="loginInput"
      required
    >

      <option value="">
        Select User
      </option>

      <option value="Anas">
        Anas
      </option>

      <option value="Jamal">
        Jamal
      </option>

      <option value="Farah">
        Farah
      </option>

      <option value="Hamza">
        Hamza
      </option>

      <option value="Fareed">
        Fareed
      </option>

      <option value="Khamis">
        Khamis
      </option>

      <option value="Extra 1">
        Extra 1
      </option>

      <option value="Extra 2">
        Extra 2
      </option>

    </select>


    <label
      class="loginLabel"
      for="password"
    >
      Password<span class="requiredStar">*</span>
    </label>


    <input
      id="password"
      class="loginInput"
      type="password"
      placeholder="Enter password"
      autocomplete="off"
      required
    >


    <button
      class="loginButton"
      onclick="login()"
    >
      Login
    </button>

  </div>

</div>



<!-- =======================================================
     MAIN APP
======================================================== -->

<div id="app">


  <!-- HEADER -->

  <header class="header">

    <div class="headerTitle">
      UP Vision Inventory
    </div>


    <div class="headerUser">

      <span>
        👤
        <strong id="loggedUser">
        </strong>
      </span>


      <button
        class="logoutButton"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </header>



  <main class="container">


    <!-- ===================================================
         BARCODE
    ==================================================== -->

    <div class="card">

      <label
        class="fieldLabel"
        for="barcode"
      >
        Barcode<span class="requiredStar">*</span>
      </label>


      <input
        id="barcode"
        class="mainInput"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Scan or enter barcode"
        required
      >

    </div>

<!-- ===================================================
         BOX NUMBER
    ==================================================== -->
    <div class="card">
      <label class="fieldLabel" for="boxNumber">
        Box Number<span class="requiredStar">*</span>
      </label>

      <input
        id="boxNumber"
        class="mainInput"
        type="text"
        autocomplete="off"
        placeholder="Enter box number"
        required
      >
    </div>

    <!-- ===================================================
         DESCRIPTION
    ==================================================== -->

    <div class="card">

      <label
        class="fieldLabel"
      >
        Product Description<span class="requiredStar">*</span>
      </label>


      <div
        id="description"
        class="description"
      >
        Waiting for barcode...
      </div>

    </div>



    <!-- ===================================================
         QUANTITY
    ==================================================== -->

    <div class="card">

      <label
        class="fieldLabel"
        for="quantity"
      >
        Total Quantity<span class="requiredStar">*</span>
      </label>


      <input
        id="quantity"
        class="mainInput quantityInput"
        type="number"
        min="1"
        step="1"
        placeholder="Enter quantity"
        required
      >


      <!-- SPLIT BOXES -->

      <div class="splitContainer">


        <!-- GREEN -->

        <div
          class="splitBox greenBox"
        >

          <div class="boxTitle">
            GREEN BOX
          </div>

          <div class="boxPercent">
            51%
          </div>

          <div
            id="greenQty"
            class="boxNumber"
          >
            0
          </div>

        </div>


        <!-- RED -->

        <div
          class="splitBox redBox"
        >

          <div class="boxTitle">
            RED BOX
          </div>

          <div class="boxPercent">
            49%
          </div>

          <div
            id="redQty"
            class="boxNumber"
          >
            0
          </div>

        </div>


      </div>

    </div>



    <!-- ===================================================
         IMAGE
    ==================================================== -->

    <div class="card">


      <button
        class="cameraButton"
        onclick="openCamera()"
      >
        📷 Add Product Image<span class="requiredStar">*</span>
      </button>


      <div
        id="previewContainer"
      >

        <img
          id="previewImage"
          alt="Product photo"
        >

      </div>


      <div
        id="status"
        class="status"
      ></div>


      <button
        id="submitButton"
        class="submitButton"
        onclick="submitProduct()"
      >
        ✓ Submit & Next Product
      </button>

    </div>


  </main>

</div>



<!-- =======================================================
     CAMERA MODAL
======================================================== -->

<div id="cameraModal">


  <div class="cameraWindow">


    <video
      id="cameraVideo"
      autoplay
      playsinline
      muted
    ></video>


    <canvas
      id="cameraCanvas"
      style="display:none;"
    ></canvas>


    <div class="cameraControls">

      <button
        class="takePhotoButton"
        onclick="takePicture()"
      >
        📸 Take Picture
      </button>


      <button
        class="closeCameraButton"
        onclick="closeCamera()"
      >
        ✕ Cancel
      </button>

    </div>


  </div>

</div>



<!-- =======================================================
     HIDDEN SAVE FORM
======================================================== -->

<form
  id="saveForm"
  method="POST"
  target="saveFrame"
  style="display:none;"
>

  <input
    type="hidden"
    name="action"
    value="submit"
  >


  <input
    type="hidden"
    id="formRequestId"
    name="requestId"
  >


  <input
    type="hidden"
    id="formUser"
    name="user"
  >


  <input
    type="hidden"
    id="formBarcode"
    name="barcode"
  >


  <input
    type="hidden"
    id="formDescription"
    name="description"
  >


  <input
    type="hidden"
    id="formTotalQty"
    name="totalQty"
  >

  <input
  type="hidden"
  id="formBoxNumber"
  name="boxNumber"
>

  <input
    type="hidden"
    id="formGreenQty"
    name="greenQty"
  >


  <input
    type="hidden"
    id="formRedQty"
    name="redQty"
  >


  <input
    type="hidden"
    id="formImageData"
    name="imageData"
  >


  <input
    type="hidden"
    id="formImageName"
    name="imageName"
  >

</form>


<iframe
  id="saveFrame"
  name="saveFrame"
  style="display:none;"
></iframe>



<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
========================================================= */

const GOOGLE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwlKx2qOyLks9wB2L3AoV7a-c5-u1KxN0-Aep7fCt-2DVVXNhHu2fbRc0ia7dtfzVdM/exec";



/* =========================================================
   USERS
========================================================= */

const USERS = {

  "Anas": "anasz3bi",

  "Jamal": "Jamal2007",

  "Farah": "Ff123456",

  "Hamza": "Hh123",

  "Fareed": "Ff123456789",

  "Khamis": "Kk123456",

   "Extra 1": "Ex123456",
  
   "Extra 2": "Ee123456"

};


let currentUser = "";

let lookupTimer = null;

let jsonpCounter = 0;

let cameraStream = null;

let capturedImage = null;



/* =========================================================
   LOGIN
========================================================= */

function login() {

  const user =
    document
      .getElementById(
        "userSelect"
      )
      .value;


  const password =
    document
      .getElementById(
        "password"
      )
      .value;


  const error =
    document
      .getElementById(
        "loginError"
      );


  error.style.display =
    "none";


  if (!user) {

    error.textContent =
      "Please select a user.";

    error.style.display =
      "block";

    return;

  }


  if (
    USERS[user] !== password
  ) {

    error.textContent =
      "Incorrect password.";

    error.style.display =
      "block";

    return;

  }


  currentUser =
    user;


  document
    .getElementById(
      "loggedUser"
    )
    .textContent =
    user;


  document
    .getElementById(
      "loginScreen"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "app"
    )
    .style.display =
    "block";


  resetProduct();


  setTimeout(
    focusBarcode,
    200
  );

}



/* =========================================================
   PASSWORD ENTER
========================================================= */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        login();

      }

    }
  );



/* =========================================================
   LOGOUT
========================================================= */

function logout() {

  closeCamera();


  currentUser =
    "";


  document
    .getElementById(
      "app"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "loginScreen"
    )
    .style.display =
    "flex";


  document
    .getElementById(
      "password"
    )
    .value =
    "";


  document
    .getElementById(
      "userSelect"
    )
    .value =
    "";


  resetProduct();

}



/* =========================================================
   BARCODE INPUT
========================================================= */

document
  .getElementById("barcode")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        lookupDescription();

        document
          .getElementById(
            "boxNumber"
          )
          .focus();

      }

    }
  );


document
  .getElementById("barcode")
  .addEventListener(
    "input",
    function() {

      clearTimeout(
        lookupTimer
      );


      const barcode =
        this.value.trim();


      if (!barcode) {

        resetDescription();

        return;

      }


      lookupTimer =
        setTimeout(
          lookupDescription,
          300
        );

    }
  );



/* =========================================================
   DESCRIPTION LOOKUP
========================================================= */

function lookupDescription() {

  const barcode =
    document
      .getElementById(
        "barcode"
      )
      .value
      .trim();


  if (!barcode) {

    resetDescription();

    return;

  }


  const box =
    document
      .getElementById(
        "description"
      );


  box.className =
    "description";


  box.textContent =
    "Looking up product...";


  jsonpCounter++;


  const callbackName =
    "descriptionCallback_" +
    jsonpCounter;


  const script =
    document.createElement(
      "script"
    );


  let finished = false;


  window[callbackName] =
    function(data) {

      finished = true;


      if (
        data &&
        data.success &&
        data.description
      ) {

        box.className =
          "description found";


        box.textContent =
          data.description;

      } else {

        box.className =
          "description not-found";


        box.textContent =
          "Product description not found.";

      }


      cleanup();

    };


  function cleanup() {

    delete window[
      callbackName
    ];


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      box.className =
        "description not-found";


      box.textContent =
        "Unable to connect to description database.";


      cleanup();

    };


  script.src =
    GOOGLE_SCRIPT_URL +
    "?action=description" +
    "&barcode=" +
    encodeURIComponent(
      barcode
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  document
    .body
    .appendChild(
      script
    );

}



/* =========================================================
   RESET DESCRIPTION
========================================================= */

function resetDescription() {

  const box =
    document
      .getElementById(
        "description"
      );


  box.className =
    "description";


  box.textContent =
    "Waiting for barcode...";

}



/* =========================================================
   QUANTITY SPLIT
========================================================= */

document
  .getElementById(
    "quantity"
  )
  .addEventListener(
    "input",
    calculateSplit
  );


function calculateSplit() {

  let quantity =
    Number(
      document
        .getElementById(
          "quantity"
        )
        .value
    );


  if (
    !Number.isFinite(quantity) ||
    quantity <= 0
  ) {

    document
      .getElementById(
        "greenQty"
      )
      .textContent =
      "0";


    document
      .getElementById(
        "redQty"
      )
      .textContent =
      "0";


    return;

  }


  quantity =
    Math.floor(
      quantity
    );


  const green =
    Math.round(
      quantity * 0.51
    );


  const red =
    quantity - green;


  document
    .getElementById(
      "greenQty"
    )
    .textContent =
    green;


  document
    .getElementById(
      "redQty"
    )
    .textContent =
    red;

}



/* =========================================================
   OPEN CAMERA
========================================================= */

async function openCamera() {

  if (
    !navigator.mediaDevices ||
    !navigator
      .mediaDevices
      .getUserMedia
  ) {

    showStatus(
      "Camera is not supported by this browser.",
      "error"
    );

    return;

  }


  try {

    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            }

          },

          audio: false

        });


    const video =
      document
        .getElementById(
          "cameraVideo"
        );


    video.srcObject =
      cameraStream;


    document
      .getElementById(
        "cameraModal"
      )
      .style.display =
      "flex";


  } catch (error) {

    console.error(error);


    showStatus(
      "Camera permission was denied or camera could not be opened.",
      "error"
    );

  }

}



/* =========================================================
   TAKE PICTURE
========================================================= */

function takePicture() {

  const video =
    document
      .getElementById(
        "cameraVideo"
      );


  const canvas =
    document
      .getElementById(
        "cameraCanvas"
      );


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    showStatus(
      "Camera is not ready yet.",
      "error"
    );

    return;

  }


  let width =
    video.videoWidth;


  let height =
    video.videoHeight;


  const maxWidth =
    1000;


  if (
    width > maxWidth
  ) {

    height =
      Math.round(
        height *
        maxWidth /
        width
      );


    width =
      maxWidth;

  }


  canvas.width =
    width;


  canvas.height =
    height;


  const context =
    canvas.getContext(
      "2d"
    );


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  capturedImage =
    canvas.toDataURL(
      "image/jpeg",
      0.65
    );


  document
    .getElementById(
      "previewImage"
    )
    .src =
    capturedImage;


  document
    .getElementById(
      "previewContainer"
    )
    .style.display =
    "block";


  closeCamera();


  showStatus(
    "Photo captured successfully.",
    "success"
  );

}



/* =========================================================
   CLOSE CAMERA
========================================================= */

function closeCamera() {

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    cameraStream =
      null;

  }


  const video =
    document
      .getElementById(
        "cameraVideo"
      );


  if (video) {

    video.srcObject =
      null;

  }


  document
    .getElementById(
      "cameraModal"
    )
    .style.display =
    "none";

}



/* =========================================================
   SUBMIT PRODUCT
========================================================= */

function submitProduct() {

  const barcode =
    document
      .getElementById(
        "barcode"
      )
      .value
      .trim();

  const boxNumber =
    document
      .getElementById("boxNumber")
      .value
      .trim();

  
  const quantity =
    Math.floor(
      Number(
        document
          .getElementById(
            "quantity"
          )
          .value
      )
    );


  let description =
    document
      .getElementById(
        "description"
      )
      .textContent
      .trim();


  const green =
    Number(
      document
        .getElementById(
          "greenQty"
        )
        .textContent
    );


  const red =
    Number(
      document
        .getElementById(
          "redQty"
        )
        .textContent
    );


  /* ======================================================
     MANDATORY VALIDATION FOR ALL FIELDS
  ====================================================== */

  if (!barcode) {

    showStatus(
      "Barcode is mandatory. Please scan or enter a barcode.",
      "error"
    );

    focusBarcode();

    return;

  }


  if (!boxNumber) {

    showStatus(
      "Box Number is mandatory. Please enter a box number.",
      "error"
    );

    document
      .getElementById("boxNumber")
      .focus();

    return;

  }


  if (
    description ===
    "Looking up product..."
  ) {

    showStatus(
      "Please wait for product description lookup to complete.",
      "error"
    );

    return;

  }


  if (
    !description ||
    description === "Waiting for barcode..." ||
    description === "Product description not found." ||
    description === "Unable to connect to description database."
  ) {

    showStatus(
      "Valid product description is mandatory before submitting.",
      "error"
    );

    return;

  }


  if (
    !quantity ||
    quantity <= 0
  ) {

    showStatus(
      "Quantity is mandatory. Please enter a valid quantity.",
      "error"
    );

    document
      .getElementById(
        "quantity"
      )
      .focus();

    return;

  }


  if (
    green + red !== quantity
  ) {

    showStatus(
      "Green + Red must equal Total Quantity.",
      "error"
    );

    return;

  }


  if (!capturedImage) {

    showStatus(
      "Product photo is mandatory. Please add an image before submitting.",
      "error"
    );

    return;

  }


  /* ======================================================
     REQUEST ID
  ====================================================== */

  const requestId =
    createRequestId();


  /* ======================================================
     DISABLE BUTTON
  ====================================================== */

  const button =
    document
      .getElementById(
        "submitButton"
      );


  button.disabled =
    true;


  button.textContent =
    "Saving...";


  showStatus(
    "Saving inventory to Google Sheets...",
    "loading"
  );


  /* ======================================================
     PREPARE FORM
  ====================================================== */

  document
    .getElementById(
      "formRequestId"
    )
    .value =
    requestId;


  document
    .getElementById(
      "formUser"
    )
    .value =
    currentUser;


  document
    .getElementById(
      "formBarcode"
    )
    .value =
    barcode;


  document
    .getElementById(
      "formDescription"
    )
    .value =
    description;


  document
    .getElementById(
      "formTotalQty"
    )
    .value =
    quantity;

  document
    .getElementById("formBoxNumber")
    .value = boxNumber;

  
  document
    .getElementById(
      "formGreenQty"
    )
    .value =
    green;


  document
    .getElementById(
      "formRedQty"
    )
    .value =
    red;


  document
    .getElementById(
      "formImageData"
    )
    .value =
    capturedImage;


  document
    .getElementById(
      "formImageName"
    )
    .value =
    createImageName(
      barcode
    );


  /* ======================================================
     SET APPS SCRIPT URL
  ====================================================== */

  const form =
    document
      .getElementById(
        "saveForm"
      );


  form.action =
    GOOGLE_SCRIPT_URL;


  /* ======================================================
     SUBMIT
  ====================================================== */

  form.submit();


  setTimeout(
    function() {

      checkSaveStatus(
        requestId,
        0
      );

    },
    1200
  );

}



/* =========================================================
   CHECK SAVE STATUS
========================================================= */

function checkSaveStatus(
  requestId,
  attempt
) {

  if (
    attempt >= 40
  ) {

    const button =
      document
        .getElementById(
          "submitButton"
        );


    button.disabled =
      false;


    button.textContent =
      "✓ Submit & Next Product";


    showStatus(

      "Save confirmation timed out. Please check Sheet 1 before submitting again.",

      "error"

    );


    return;

  }


  const callbackName =
    "statusCallback_" +
    Date.now() +
    "_" +
    attempt;


  const script =
    document.createElement(
      "script"
    );


  let finished =
    false;


  window[callbackName] =
    function(data) {

      finished =
        true;


      cleanup();


      /* ====================================
         SUCCESS
      ==================================== */

      if (
        data &&
        data.completed &&
        data.success
      ) {

        saveSucceeded();

        return;

      }


      /* ====================================
         ERROR
      ==================================== */

      if (
        data &&
        data.completed &&
        !data.success
      ) {

        saveFailed(
          data.error ||
          "Google Apps Script could not save the record."
        );

        return;

      }


      /* ====================================
         STILL PROCESSING
      ==================================== */

      setTimeout(
        function() {

          checkSaveStatus(
            requestId,
            attempt + 1
          );

        },
        1000
      );

    };


  function cleanup() {

    delete window[
      callbackName
    ];


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      cleanup();


      setTimeout(
        function() {

          checkSaveStatus(
            requestId,
            attempt + 1
          );

        },
        1000
      );

    };


  script.src =
    GOOGLE_SCRIPT_URL +
    "?action=status" +
    "&requestId=" +
    encodeURIComponent(
      requestId
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  document
    .body
    .appendChild(
      script
    );

}



/* =========================================================
   SAVE SUCCESS
========================================================= */

function saveSucceeded() {

  const button =
    document
      .getElementById(
        "submitButton"
      );


  button.disabled =
    false;


  button.textContent =
    "✓ Submit & Next Product";


  showStatus(
    "✓ Saved successfully to Sheet 1.",
    "success"
  );


  resetProduct();


  setTimeout(
    function() {

      focusBarcode();

    },
    200
  );

}



/* =========================================================
   SAVE FAILURE
========================================================= */

function saveFailed(
  message
) {

  const button =
    document
      .getElementById(
        "submitButton"
      );


  button.disabled =
    false;


  button.textContent =
    "✓ Submit & Next Product";


  showStatus(
    "Unable to save: " +
    message,
    "error"
  );

}



/* =========================================================
   RESET PRODUCT
========================================================= */

function resetProduct() {

  document
    .getElementById(
      "barcode"
    )
    .value =
    "";

  document
    .getElementById("boxNumber")
    .value = "";

  
  document
    .getElementById(
      "quantity"
    )
    .value =
    "";


  resetDescription();


  document
    .getElementById(
      "greenQty"
    )
    .textContent =
    "0";


  document
    .getElementById(
      "redQty"
    )
    .textContent =
    "0";


  capturedImage =
    null;


  document
    .getElementById(
      "previewImage"
    )
    .src =
    "";


  document
    .getElementById(
      "previewContainer"
    )
    .style.display =
    "none";

}



/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type
) {

  const status =
    document
      .getElementById(
        "status"
      );


  status.textContent =
    message;


  status.className =
    "status " + type;

}



/* =========================================================
   FOCUS BARCODE
========================================================= */

function focusBarcode() {

  const barcode =
    document
      .getElementById(
        "barcode"
      );


  barcode.focus();

  barcode.select();

}



/* =========================================================
   REQUEST ID
========================================================= */

function createRequestId() {

  return (

    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 12)

  );

}



/* =========================================================
   IMAGE NAME
========================================================= */

function createImageName(
  barcode
) {

  const timestamp =
    new Date()
      .toISOString()
      .replace(
        /[:.]/g,
        "-"
      );


  return (

    "UPVision_" +
    barcode +
    "_" +
    timestamp +
    ".jpg"

  );

}



/* =========================================================
   QUANTITY ENTER
========================================================= */

document
  .getElementById(
    "quantity"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        submitProduct();

      }

    }
  );

</script>
